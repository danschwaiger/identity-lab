name: identity-lab
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      LAB_HOST: ${LAB_HOST:?Set LAB_HOST in .env}
      NGINX_ENVSUBST_FILTER: "^LAB_HOST$"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs/lab-server.crt:/etc/nginx/certs/lab-server.crt:ro
      - ./certs/lab-server.key:/etc/nginx/certs/lab-server.key:ro
    networks:
      lab:
        ipv4_address: 172.30.42.10
        aliases:
          - ${LAB_HOST}

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    command:
      - start-dev
      - --hostname=https://${LAB_HOST}/auth
      - --http-relative-path=/auth
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - lab

  redis:
    image: redis:8.2.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - lab

  tyk:
    image: tykio/tyk-gateway:v5.8.20
    restart: unless-stopped
    environment:
      TYK_GW_SECRET: ${TYK_GW_SECRET}
    volumes:
      - ./tyk/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk/apps:/opt/tyk-gateway/apps:ro
    depends_on:
      - redis
    networks:
      - lab

  demo-api:
    image: hashicorp/http-echo:1.0.0
    restart: unless-stopped
    command:
      - -listen=:5678
      - -text=Hello from the demo API through Tyk!
    networks:
      - lab

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    restart: unless-stopped
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=https://${LAB_HOST}/auth/realms/lab
      - --client-id=lab-app
      - --redirect-url=https://${LAB_HOST}/oauth2/callback
      - --code-challenge-method=S256
      - --provider-ca-file=/etc/oauth2-proxy/certs/lab-ca.crt
      - --use-system-trust-store=true
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.30.42.10/32
      - --email-domain=lab.test
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --upstream=http://tyk:8080/
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
    volumes:
      - ./certs/lab-ca.crt:/etc/oauth2-proxy/certs/lab-ca.crt:ro
    networks:
      - lab

volumes:
  keycloak-data:
  redis-data:

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24
